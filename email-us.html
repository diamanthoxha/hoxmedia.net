<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!-- CSS only -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="assets/plugins/hover.min.css" as="style">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css" as="style">
    <link rel="preload" href="assets/images/loading.svg" as="image">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;900&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="assets/css/main.min.css">
    <style>
        .page-404 {
            background: url("assets/images/404-background.jpg") no-repeat center;
            background-size: cover;
        }

        .page-404 h4 {
            font-family: "ZonaPro", "Montserrat", sans-serif;
            font-size: 6.25vw;
            font-weight: bold;
            text-align: center;
            color: var(--black);
            text-shadow: -1px 0 var(--white), 0 1px var(--white), 1px 0 var(--white), 0 -1px var(--white);
            z-index: 4;
            mix-blend-mode: screen;
        }

        .page-404 h3 {
            z-index: 3;
            margin-top: -8vw;
            font-size: 20vw;
            font-weight: bold;
            color: var(--theme);
        }

        .page-404 p {
            text-transform: uppercase;
            color: var(--dark-text);
            text-align: center;
        }

        @media (max-width: 767.98px ) {
            .page-404 h4 {
                font-size: 12.9vw;
            }

            .page-404 h3 {
                margin-top: -16vw;
                font-size: 39vw;
            }

            .page-404 p {
                font-size: 3.75vw;
            }

            .page-404 a {
                margin: 2rem 0;
            }
        }

        @media (min-width: 768px) and (max-width: 991.98px) {
        }


    </style>
    <title>Page Not Found | 404</title>
</head>
<body style="background-color: black" class="page-404 min-vh-100">

<div class="container-fluid h-100 d-flex align-items-center justify-content-center flex-column">
    <div class="row">
        <div class="col-12 d-flex align-items-center justify-content-center flex-column">
            <h4>OOPS!</h4>
            <h3>404</h3>
            <p>The page you are looking for was moved, removed, renamed or never existed</p>
            <a class="btn btn-outline-warning border-0 theme-hover-button" href="team.html">TAKE ME HOME</a>
        </div>
    </div>
</div>

</body>
</html>
